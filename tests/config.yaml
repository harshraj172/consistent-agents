eval:
    n_perturbations: 2
    seed: 42
benchmark:
    path: consistent_agents.benchmarks.truthfulqa:TruthfulQABenchmark
    params:
      split: "validation[:1]"
agent:
    path: consistent_agents.agents.default:DefaultAgent
    params:
      config_class_name: default
    model:
        path: consistent_agents.models.litellm:LitellmModel
        params:
          model_name: gpt-4o-mini
          model_kwargs:
            temperature: 0.1
            max_tokens: 300
    environment:
        path: consistent_agents.environments.docker:DockerEnvironment
        params:
          name: my_local
perturbations:
  - path: consistent_agents.perturbations.injection:BasePerturbation
    name: identity
    params:
      seed: 42
output:
    path: outputs/test.json