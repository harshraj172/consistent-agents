[project]
name = "consistent_agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Harsh Raj", email = "harsh777111raj@gmail.com" }, { name = "Subho Majumdar", email = "zoom.subha@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.11.7",
    "shortuuid>=1.0.13",
    "typer>=0.16.0",
    "requests>=2.32.4",
    "pyyaml>=6.0.2",
    "datasets>=3.6.0",
    "rich>=14.1.0",
    "toml>=0.10.2",
    "tenacity>=9.1.2",
    "python-dotenv>=1.1.1",
    "litellm>=1.76.1",
    "jinja2>=3.1.6",
    "scipy>=1.10.0",
]

[project.scripts]
sandboxes = "sandboxes.cli.sb.main:app"
sb = "sandboxes.cli.sb.main:app"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "bert-score>=0.3.13",
    "rouge_score>=0.1.2",
    "openai>=2.3.0",

]

[tool.ruff.lint.isort]
known-first-party = ["sandboxes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "asyncio: marks tests as async tests",
    "runtime: marks tests as runtime tests (may need docker)",
    "unit: marks tests as unit tests (fast, no external dependencies)",
]

[tool.coverage.run]
source = ["src/sandboxes"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.ty.src]
include = ["sandboxes"]
