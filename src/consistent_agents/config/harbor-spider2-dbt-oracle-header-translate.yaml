eval:
  n_perturbations: 0
  seed: 42

benchmark:
  path: consistent_agents.benchmarks.harbor_spider2_dbt:HarborSpider2DBTBenchmark
  params:
    split: "all"
    cache_dir: .cache
    tasks_root: .harbor_tasks/spider2_dbt_header_translate
    force_reclone: false
    overwrite: false
    include_db_variants: true
    db_perturb_seed: 42
    db_perturb_spec:
      name: header_translate
      perturbation_types:
        - header_translate

perturbations: []

harbor:
  task:
    template_path: .harbor_tasks/spider2_dbt_header_translate
    instruction_file: instruction.md
    workdir: .harbor_runs
    keep: false
    rewrite_instruction: false
  agent:
    name: oracle
  environment:
    type: docker
    delete: true
  verifier: {}
  trials_dir: harbor-trials
  timeout_multiplier: 1.0
  reward_key: reward

output:
  path: outputs/harbor-spider2-dbt-oracle-header-translate
