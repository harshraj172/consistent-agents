eval:
  n_perturbations: 2
  seed: 42

benchmark:
  path: consistent_agents.benchmarks.harbor_spider2_dbt:HarborSpider2DBTBenchmark
  params:
    split: "all"
    sample_tasks: 1.0 # int=count | float in [0,1]=fraction
    cache_dir: .cache
    tasks_root: .harbor_tasks/spider2_dbt
    force_reclone: false
    overwrite: false

perturbations:
  - path: consistent_agents.perturbations.paraphrase:LLMParaphrasePerturbation
    name: paraphrase
    params:
      seed: 42
  - path: consistent_agents.perturbations.translation:LLMBackTranslationPerturbation
    name: translation
    params:
      seed: 42

harbor:
  task:
    template_path: .harbor_tasks/spider2_dbt
    instruction_file: instruction.md
    workdir: .harbor_runs
    keep: false
    rewrite_instruction: false
  agent:
    name: codex
    model_name: openai/gpt-5.1-codex
  environment:
    type: docker
    delete: true
  verifier: {}
  trials_dir: harbor-trials
  timeout_multiplier: 1.0
  reward_key: reward

output:
  path: outputs/harbor-spider2-dbt.json