eval:
    n_perturbations: 4
    seed: 42
benchmark:
    path: consistent_agents.benchmarks.swebench.swebench_benchmark:SWEBenchBenchmark
    params:
      split: "test[:2]"
metrics:
  - path: consistent_agents.metrics.accuracy:AccuracyMetric
    name: accuracy
    params:
      judge_model: "gpt-4o-mini"
  - path: consistent_agents.metrics.consistency:ConsistencyMetric
    name: consistency
    params:
      judge_model: "gpt-4o-mini"
agent:
    path: consistent_agents.agents.default:DefaultAgent
    params:
      config_class_name: default
    model:
        path: consistent_agents.models.litellm:LitellmModel
        params:
          model_name: gpt-5-mini
          model_kwargs:
            temperature: 1
            max_tokens: 3000
perturbations:
  - path: consistent_agents.perturbations.injection_swe:LLMInjectionSWEPerturbation
    name: swe-injection
    params:
      seed: 42
  - path: consistent_agents.perturbations.noise_swe:LLMNoiseSWEPerturbation
    name: swe-noise
    params:
      seed: 21
output:
    path: outputs/swebench.json