eval:
  n_perturbations: 2
  seed: 42

benchmark:
  path: consistent_agents.benchmarks.harbor_prompt_benchmark:HarborPromptBenchmark
  params:
    template_path: /home/ec2-user/harsh/harbor/examples/tasks/hello-world
    prompt: "Create a file called hello.txt with \"Hello, world!\" as the content."

perturbations:
  - path: consistent_agents.perturbations.paraphrase:LLMParaphrasePerturbation
    name: paraphrase
    params:
      seed: 42
  - path: consistent_agents.perturbations.translation:LLMBackTranslationPerturbation
    name: translation
    params:
      seed: 42

metrics:
  - path: consistent_agents.metrics.accuracy:AccuracyMetric
    name: accuracy
    params:
      judge_model: "gpt-4o-mini"
  - path: consistent_agents.metrics.consistency:ConsistencyMetric
    name: consistency
    params:
      judge_model: "gpt-4o-mini"

harbor:
  task:
    template_path: /home/ec2-user/harsh/harbor/examples/tasks/hello-world
    instruction_file: instruction.md
    workdir: .harbor_tasks
    keep: false
  agent:
    name: codex
    model_name: openai/gpt-4o-mini
  environment:
    type: docker
    delete: true
  verifier: {}
  trials_dir: harbor-trials
  timeout_multiplier: 1.0
  reward_key: reward

output:
  path: outputs/harbor-hello.json
